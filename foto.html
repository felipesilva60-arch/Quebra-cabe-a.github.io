<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossa Foto</title>


  <link rel="stylesheet" href="style.css">
</head>


<body>


<div class="background"></div>


<div class="game-container">


  <div class="top-bar">
    <h1>Nossa Foto</h1>
    <p>Monte sua imagem favorita</p>
  </div>


  <div class="menu">


    <label class="upload-btn">
      📷 Escolha a Foto
      <input type="file" id="upload" accept="image/*" hidden>
    </label>


    <select id="difficulty">
      <option value="3">🙂Fácil 3x3</option>
      <option value="4">😐Médio 4x4</option>
      <option value="5">😕Difícil 5x5</option>
      <option value="6">😈Insano 6x6</option>
    </select>


    <button onclick="shufflePieces()">➰​ Embaralhar</button>
    <button onclick="solvePuzzle()">✔️​ Resolver</button>


  </div>


  <div class="stats">
    <div class="card">
      ⏰​
      <span id="timer">0</span>
      <small>Segundos</small>
    </div>


    <div class="card">
      🎯
      <span id="moves">0</span>
      <small>Movimentos</small>
    </div>
  </div>


  <div id="puzzle"></div>


  <div class="preview-box">
    <h2>Imagem Original</h2>
    <img id="preview" src="">
  </div>


</div>


<script src="script.js"></script>
</body>
</html>
